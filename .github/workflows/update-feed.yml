name: Update InRoom RQChat feed

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate XML feed
        env:
          SOURCE_FEED_URL: https://in-room.ru/marketplace/4675585.xml
          TARGET_URL: https://in-room.rqch.ru/
          OUTPUT_FILE: docs/inroom-rqchat.xml
          REQUEST_TIMEOUT: "120"
          MAX_RETRIES: "3"
        run: python scripts/update_feed.py

      - name: Generate gray XML feed
        env:
          SOURCE_FEED_URL: https://in-room.ru/marketplace/4675585.xml
          TARGET_URL: https://in-room.rqch.ru/
          GRAY_OUTPUT_FILE: docs/inroom-gray.xml
          REQUEST_TIMEOUT: "120"
          MAX_RETRIES: "3"
        run: python scripts/update_gray_feed.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/inroom-rqchat.xml docs/inroom-gray.xml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update InRoom RQChat feed"
            git push
          fi

